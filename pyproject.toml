[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restaurantscraper"
version = "0.2.0"
description = "High-performance restaurant menu scraper, organized database explorer, and export tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eldion Ryan Godius", email = "engineering@restaurantscraper.local" },
]
keywords = [
    "scraper",
    "web-scraping",
    "grabfood",
    "foodpanda",
    "restaurant-scraper",
    "menu-scraper",
    "restaurant-menu",
    "playwright",
    "sqlite",
    "data-extraction",
    "data-export",
    "csv-export",
    "json-export",
    "openstreetmap",
    "local-first",
    "automation",
    "cli",
    "local-gui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/ElXprogramming/RestaurantScraper"
Repository = "https://github.com/ElXprogramming/RestaurantScraper"
Issues = "https://github.com/ElXprogramming/RestaurantScraper/issues"
Changelog = "https://github.com/ElXprogramming/RestaurantScraper/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
restaurantscraper = "scraper.cli:app"
scraper = "scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
